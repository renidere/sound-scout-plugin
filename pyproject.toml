[project]
name = "sound-scout"
version = "0.1.0"
description = "Sound analysis of Russian speech for the Hermes agent: CLI and local MCP stdio server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=19.0.2",
    "faster-whisper>=1.2.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "praat-parselmouth>=0.4.7",
]

[project.scripts]
sound-scout = "sound_scout.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".work-task", ".revmux", "data", "runs", "local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: tests that run a real model or a long synthesis; deselect with -m \"not slow\"",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
