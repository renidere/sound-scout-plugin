[project]
name = "sound-scout"
version = "0.1.0"
description = "Sound analysis of Russian speech for the Hermes agent: CLI and local MCP stdio server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=19.0.2",
    "faster-whisper>=1.2.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "praat-parselmouth>=0.4.7",
]

[project.scripts]
sound-scout = "sound_scout.cli:main"

[project.optional-dependencies]
gate0-borealis = [
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
gate0-gigachat = [
    "safetensors>=0.8.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==4.57.6",
]
corpus-tts = [
    "onnx==1.23.2",
    "piper-tts[alignment]==1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".work-task", ".revmux", "data", "runs", "local"]
# The Hermes package runs on the Hermes interpreter, which requires Python >= 3.11.
# The GPU host files run on the image's Python 3.12; they stay valid down to 3.10.
per-file-target-version = { "hermes/plugin/**/*.py" = "py311", "src/sound_scout/eval/gpu_host/*.py" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# A full run writes about 2 GB to tmp_path; keep only a failed test's dirs, one session (#169).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "slow: a real model, a long synthesis, the dry stack, or 0.8 s or more on the station; deselect with -m \"not slow\"",
]

[tool.uv]
conflicts = [[{ extra = "gate0-borealis" }, { extra = "gate0-gigachat" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
