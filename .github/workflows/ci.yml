name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    # Набор без репетиции #149: её сценарии идут в job rehearsal (#167). С ними checks занимал
    # 41 мин из 45. Предел 45 мин: худшая установка ffmpeg (23 мин) плюс набор (около 12 мин) с запасом.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - &detect-package
        name: Detect the package
        id: pkg
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: No package yet
        if: steps.pkg.outputs.present == 'false'
        run: echo "pyproject.toml is not there yet - nothing to check until the scaffold task lands"

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.pkg.outputs.present == 'true'
        with:
          enable-cache: true

      - &install-ffmpeg
        name: Install ffmpeg
        if: steps.pkg.outputs.present == 'true'
        # Один путь установки для checks и clean-install (#183): набор .deb из кэша Actions без
        # зеркала apt — свой набор образа или набор другого образа (#184), без годного набора —
        # скачивание с повторами (#65, #70). Худший путь: 2 мин на застрявшее восстановление кэша,
        # 1 мин на набор другого образа, который не встал, скачивание 18 мин (2 × 5,5 + 5 + 2 на
        # установку), 2 мин на сохранение: 23. Три неудачные попытки дают ::error:: через
        # 2 + 1 + 3 × 5,5 = 19,5 мин, до предела.
        timeout-minutes: 23
        uses: ./.github/actions/install-ffmpeg

      - name: Sync
        if: steps.pkg.outputs.present == 'true'
        run: uv sync --locked --all-groups

      - name: Lint
        if: steps.pkg.outputs.present == 'true'
        run: uv run ruff check .

      - name: Format
        if: steps.pkg.outputs.present == 'true'
        run: uv run ruff format --check .

      - name: Test
        if: steps.pkg.outputs.present == 'true'
        env:
          HF_HUB_OFFLINE: "1"
          SOUND_SCOUT_NO_NETWORK: "1"
        run: uv run pytest -m "not rehearsal"

  rehearsal:
    runs-on: ubuntu-latest
    # Репетиция #149 (tests/test_eval_rehearsal.py), сценариев: 85, unit: 3. Подряд это около 22 мин,
    # поэтому три шарда на отдельных раннерах, 6–8 мин каждый (#167). У каждого шарда свой CPU:
    # окна реального времени сценариев не сжимаются под общей нагрузкой. Что каждое имя попадает
    # ровно в один шард, проверяет test_the_ci_shards_run_every_scenario_and_unit_exactly_once.
    # ffmpeg репетиции не нужен. Предел 20 мин: шард и установка среды с запасом в 2 раза.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
          SOUND_SCOUT_NO_NETWORK: "1"
          REHEARSAL_SHARD: ${{ matrix.shard }}
        run: uv run pytest -m rehearsal

  clean-install:
    runs-on: ubuntu-latest
    # Набор тестов checks, без репетиции #149: её на том же коммите проверяет job rehearsal (#167).
    # Предел 45 мин, как у checks.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - *detect-package

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - *install-ffmpeg

      - name: Clean install check
        run: bash scripts/clean-install-check.sh -m "not rehearsal"

  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the history for private data
        run: bash scripts/scan-history.sh
