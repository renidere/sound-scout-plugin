name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    # Набор без репетиции #149: её сценарии идут в job rehearsal (#167). С ними checks занимал
    # 41 мин из 45. Предел 45 мин: худшая установка ffmpeg (18 мин) плюс набор (около 12 мин) с запасом.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - &detect-package
        name: Detect the package
        id: pkg
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: No package yet
        if: steps.pkg.outputs.present == 'false'
        run: echo "pyproject.toml is not there yet - nothing to check until the scaffold task lands"

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.pkg.outputs.present == 'true'
        with:
          enable-cache: true

      - &install-ffmpeg
        name: Install ffmpeg
        if: steps.pkg.outputs.present == 'true'
        # Худший успешный путь: (attempts − 1) × (attempt_minutes + 0,5 мин kill-after) на зависшие
        # попытки, attempt_minutes на удачную и не меньше 2 мин на локальную установку: 2 × 5,5 + 5 + 2 = 18.
        # .deb, скачанные попыткой, которую оборвал timeout, остаются в кэше apt, и следующая попытка
        # продолжает с них.
        timeout-minutes: 18
        run: |
          apt_opts=(-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          attempts=3
          attempt_minutes=5
          for attempt in $(seq "$attempts"); do
            if sudo timeout --kill-after=30s "${attempt_minutes}m" bash -c \
              'apt-get "$@" update && apt-get "$@" install -y --download-only ffmpeg' apt "${apt_opts[@]}"; then
              break
            fi
            echo "::warning::ffmpeg download attempt $attempt of $attempts failed or exceeded ${attempt_minutes} min"
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::ffmpeg packages were not downloaded in $attempts attempts of ${attempt_minutes} min each (slow or failing apt mirror)"
              exit 1
            fi
          done
          sudo apt-get "${apt_opts[@]}" install -y --no-download ffmpeg

      - name: Sync
        if: steps.pkg.outputs.present == 'true'
        run: uv sync --locked --all-groups

      - name: Lint
        if: steps.pkg.outputs.present == 'true'
        run: uv run ruff check .

      - name: Format
        if: steps.pkg.outputs.present == 'true'
        run: uv run ruff format --check .

      - name: Test
        if: steps.pkg.outputs.present == 'true'
        env:
          HF_HUB_OFFLINE: "1"
          SOUND_SCOUT_NO_NETWORK: "1"
        run: uv run pytest -m "not rehearsal"

  rehearsal:
    runs-on: ubuntu-latest
    # Репетиция #149 (tests/test_eval_rehearsal.py), сценариев: 85, unit: 3. Подряд это около 22 мин,
    # поэтому три шарда на отдельных раннерах, 6–8 мин каждый (#167). У каждого шарда свой CPU:
    # окна реального времени сценариев не сжимаются под общей нагрузкой. Что каждое имя попадает
    # ровно в один шард, проверяет test_the_ci_shards_run_every_scenario_and_unit_exactly_once.
    # ffmpeg репетиции не нужен. Предел 20 мин: шард и установка среды с запасом в 2 раза.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
          SOUND_SCOUT_NO_NETWORK: "1"
          REHEARSAL_SHARD: ${{ matrix.shard }}
        run: uv run pytest -m rehearsal

  clean-install:
    runs-on: ubuntu-latest
    # Набор тестов checks, без репетиции #149: её на том же коммите проверяет job rehearsal (#167).
    # Предел 45 мин, как у checks.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - *detect-package

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - *install-ffmpeg

      - name: Clean install check
        run: bash scripts/clean-install-check.sh -m "not rehearsal"

  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the history for private data
        run: bash scripts/scan-history.sh
