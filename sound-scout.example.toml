# Пример локальной конфигурации оператора. Скопируйте в `sound-scout.toml` (он в .gitignore)
# в текущий рабочий каталог или укажите путь к файлу в `SOUND_SCOUT_CONFIG`, затем
# раскомментируйте поля. Строки с полями закомментированы одним `# `; пути — иллюстрация.
# Обязательны только `allowed_roots` и `data_root`; у остальных полей показаны значения по
# умолчанию. Неизвестное поле — ошибка: секретов (ключей провайдера) здесь быть не должно, R09.

# Абсолютные каталоги, из которых разрешено читать входные записи (R10). Вход вне них отклоняется.
# allowed_roots = ["/path/to/recordings"]

# Абсолютный приватный каталог для run-каталогов, клипов и отчётов (R10). Ничего не пишется вне
# него; он не может лежать внутри одного из `allowed_roots`, и наоборот.
# data_root = "/path/to/sound-scout-data"

# Backend слухового анализа — один, выбирается после Gate 0 (R01). Пока только `none`.
# backend = "none"

# Инженерные пределы версии (R02, R10, R11): вход и время обработки.
# [budgets]
# max_duration_seconds = 180
# max_input_bytes = 104857600
# max_channels = 2
# worker_deadline_seconds = 180

# Сеть по умолчанию запрещена: без загрузок моделей, без внешнего inference, без телеметрии (R09).
# [network]
# allow = false
