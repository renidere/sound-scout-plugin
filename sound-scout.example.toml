# Пример локальной конфигурации оператора. Скопируйте в `sound-scout.toml` (он в .gitignore)
# и раскомментируйте нужные поля. Значения ниже — иллюстрация, не умолчания.

# Каталоги, из которых разрешено читать входные записи (R09). Вход вне этих корней отклоняется.
# allowed_roots = ["/path/to/recordings"]

# Приватный каталог, куда пишутся run-каталоги, клипы и отчёты (R09). Ничего не пишется вне него.
# data_root = "/path/to/sound-scout-data"

# Инженерные пределы версии (R02, R10): размер входа, длительность, время обработки.
# [budgets]
# max_input_bytes = 104857600
# max_duration_seconds = 180
# wall_time_seconds = 180

# Backend слухового анализа — один, выбирается после Gate 0 (R01). Пока не выбран.
# [backend]
# name = ""
